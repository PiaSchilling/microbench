# Wish list of hardware counters for gfx942 (input of tools/plan_counter_passes.sh).
# Selection and justification: docs/counter_selection.md
# Format: want.<group>=<counter>,<counter>,...   agg.<counter>=sum|wmean (default sum)

# Only active (uncommented) want.* lines are planned. Default: only the speed-of-light
# group (about 2 passes). Uncomment further groups to collect more counters (all groups:
# about 9 passes). A counter listed in several active groups is collected once (the
# planner prints a warning).

# Speed of light: counters of the Kiviat axes (adapted from the rocprof-compute
# "System Speed-of-Light" panel).
#   VALU utilization    = SQ_ACTIVE_INST_VALU / (GRBM_GUI_ACTIVE * CUs)
#   Matrix Cores util.  = SQ_VALU_MFMA_BUSY_CYCLES / (GRBM_GUI_ACTIVE * CUs * 4)
#   SALU utilization    = SQ_ACTIVE_INST_SCA / (GRBM_GUI_ACTIVE * CUs)
#   LDS bandwidth       = (SQ_LDS_IDX_ACTIVE - SQ_LDS_BANK_CONFLICT) * 32 banks * 4 B / time
#   vL1D bandwidth      = TCP_TOTAL_CACHE_ACCESSES_sum * 32 B / time
#   L2 bandwidth        = TCC_REQ_sum * 128 B / time
#   beyond L2 (fabric)  = read:  128 * TCC_BUBBLE_sum + 64 * (TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) + 32 * TCC_EA0_RDREQ_32B_sum
#                         write: 64 * TCC_EA0_WRREQ_64B_sum + 32 * (TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum)
#   (GRBM_GUI_ACTIVE is counted by every XCD; CUs = 228 on the MI300A. The HBM axis
#   comes from the telemetry, average_umc_activity, not from a counter.)
want.sol=GRBM_GUI_ACTIVE,SQ_ACTIVE_INST_VALU,SQ_VALU_MFMA_BUSY_CYCLES,SQ_ACTIVE_INST_SCA,SQ_LDS_IDX_ACTIVE,SQ_LDS_BANK_CONFLICT,TCP_TOTAL_CACHE_ACCESSES_sum,TCC_REQ_sum,TCC_BUBBLE_sum,TCC_EA0_RDREQ_sum,TCC_EA0_RDREQ_32B_sum,TCC_EA0_WRREQ_sum,TCC_EA0_WRREQ_64B_sum

