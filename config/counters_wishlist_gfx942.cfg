# Wish list of hardware counters for gfx942 (input of tools/plan_counter_passes.sh).
# Selection and justification: docs/counter_selection.md
# Format: want.<group>=<counter>,<counter>,...   agg.<counter>=sum|wmean (default sum)

# Time base and activity
want.time=GRBM_COUNT,GRBM_GUI_ACTIVE,SQ_BUSY_CU_CYCLES,SQ_WAVES,SQ_WAVE_CYCLES,SQ_INSTS,SQ_ACTIVE_INST_ANY,SQ_WAIT_ANY,SQ_WAIT_INST_ANY
# Instruction mix
want.instmix=SQ_INSTS_VALU,SQ_INSTS_MFMA,SQ_INSTS_SALU,SQ_INSTS_SMEM,SQ_INSTS_VMEM_RD,SQ_INSTS_VMEM_WR,SQ_INSTS_LDS,SQ_INSTS_BRANCH
# VALU arithmetic
want.valu_arith=SQ_INSTS_VALU_ADD_F16,SQ_INSTS_VALU_MUL_F16,SQ_INSTS_VALU_FMA_F16,SQ_INSTS_VALU_TRANS_F16,SQ_INSTS_VALU_ADD_F32,SQ_INSTS_VALU_MUL_F32,SQ_INSTS_VALU_FMA_F32,SQ_INSTS_VALU_TRANS_F32,SQ_INSTS_VALU_ADD_F64,SQ_INSTS_VALU_MUL_F64,SQ_INSTS_VALU_FMA_F64,SQ_INSTS_VALU_TRANS_F64,SQ_INSTS_VALU_INT32,SQ_INSTS_VALU_INT64,SQ_INSTS_VALU_CVT
# Pipeline utilization
want.pipeline=SQ_ACTIVE_INST_VALU,SQ_THREAD_CYCLES_VALU,SQ_ACTIVE_INST_SCA,SQ_ACTIVE_INST_VMEM,SQ_ACTIVE_INST_FLAT,SQ_ACTIVE_INST_LDS,SQ_ACTIVE_INST_MISC,SQ_VALU_MFMA_BUSY_CYCLES
# Matrix cores (for later)
want.mfma=SQ_INSTS_VALU_MFMA_MOPS_F16,SQ_INSTS_VALU_MFMA_MOPS_BF16,SQ_INSTS_VALU_MFMA_MOPS_F32,SQ_INSTS_VALU_MFMA_MOPS_F64,SQ_INSTS_VALU_MFMA_MOPS_I8,SQ_INSTS_VALU_MFMA_MOPS_F8
# LDS
want.lds=SQ_LDS_IDX_ACTIVE,SQ_LDS_BANK_CONFLICT
# Vector L1 (vL1D) and address translation
want.vl1d=TCP_TOTAL_CACHE_ACCESSES_sum,TCP_TOTAL_ACCESSES_sum,TCP_TCC_READ_REQ_sum,TCP_TCC_WRITE_REQ_sum,TA_TOTAL_WAVEFRONTS_sum,TCP_UTCL1_REQUEST_sum,TCP_UTCL1_TRANSLATION_MISS_sum
# L2 cache
want.l2=TCC_REQ_sum,TCC_READ_sum,TCC_WRITE_sum,TCC_HIT_sum,TCC_MISS_sum,TCC_WRITEBACK_sum
# L2 to fabric (Infinity Cache / HBM)
want.fabric=TCC_EA0_RDREQ_sum,TCC_EA0_RDREQ_32B_sum,TCC_BUBBLE_sum,TCC_EA0_WRREQ_sum,TCC_EA0_WRREQ_64B_sum,TCC_EA0_RDREQ_DRAM_sum,TCC_EA0_WRREQ_DRAM_sum,TCC_EA0_RDREQ_LEVEL_sum,TCC_EA0_WRREQ_LEVEL_sum
# Derived counters (rocprofv3) that cannot be computed afterwards (based on accumulate()).
# Formula counters (VALUBusy, VALUUtilization, FETCH_SIZE, WRITE_SIZE, OccupancyPercent,
# MfmaUtil) are left out: the analysis computes them from the raw counters above.
want.derived=MeanOccupancyPerCU,VmemLatency

# ratios and latencies: mean weighted by kernel duration
agg.MeanOccupancyPerCU=wmean
agg.VmemLatency=wmean
