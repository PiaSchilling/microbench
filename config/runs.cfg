# Run config. See docs/benchmark_contract.md, section 9.
#
# Format:  <label> <benchmark> <arguments ...>
#   label      unique name of the run (used in logs, result directories and with --only)
#   benchmark  name of a benchmark in src/ (fma | mfma | copy | reuse | chase | gemm; see: run_suite.sh --list)
#   {DURATION} is replaced by the duration of the mode (or --duration);
#              in check mode every --duration is replaced by the check duration
#
# Comment out lines to disable runs. Values are tuned for MI300A (gfx942):
#   L1 32 KiB/CU, L2 4 MiB/XCD, Infinity Cache 256 MiB, HBM 128 GB.

# --- Level 1: Compute (VALU), compute-bound -------------------------------------------
fma_fp64        fma     --duration {DURATION} --ops_per_element 1000000 --precision fp64
fma_fp32        fma     --duration {DURATION} --ops_per_element 1000000 --precision fp32
fma_fp16        fma     --duration {DURATION} --ops_per_element 1000000 --precision fp16
# Integer noch nicht validiert:
#fma_int32      fma     --duration {DURATION} --ops_per_element 1000000 --precision int32

# --- Level 1: Compute (Matrix Cores, MFMA), compute-bound ------------------------------
# Kernel aus der rocprof-compute-Roofline, konstante Operanden (wenig Bit-Wechsel)
mfma_fp64       mfma    --duration {DURATION} --precision fp64
mfma_fp32       mfma    --duration {DURATION} --precision fp32
mfma_fp16       mfma    --duration {DURATION} --precision fp16
mfma_bf16       mfma    --duration {DURATION} --precision bf16
mfma_int8       mfma    --duration {DURATION} --precision int8
mfma_fp8        mfma    --duration {DURATION} --precision fp8

# --- Level 1: Speicherbandbreite --------------------------------------------------------
# copy_l2         copy  --duration {DURATION} --elements 524288      # 8 MiB gesamt -> Laufzeit so kurz, dass GB/s eher Kernel-Start als Bandbreite
# copy_llc        copy  --duration {DURATION} --elements 8388608     # 128 MiB gesamt -> Laufzeit so kurz, dass GB/s eher Kernel-Start als Bandbreite
copy_hbm        copy  --duration {DURATION} --elements 134217728     # 2 GiB gesamt
reuse_l1        reuse   --duration {DURATION} --level l1     # buffer 32 KiB, 100 passes (rocprof-compute roofline)
reuse_l2        reuse   --duration {DURATION} --level l2     # buffer 4 MiB, 10 passes
reuse_llc       reuse   --duration {DURATION} --level llc    # buffer 64 MiB (LLC = Infinity Cache), 1 pass

# --- Level 1: Speicherlatenz (Pointer Chasing) -------------------------------------------
# accesses >= Anzahl Knoten (working_set / stride), damit die ganze Kette durchlaufen wird
chase_l1        chase   --duration {DURATION} --working_set_bytes 16384      --stride_bytes 128 --accesses 1000000
chase_l2        chase   --duration {DURATION} --working_set_bytes 2097152    --stride_bytes 128 --accesses 1000000
chase_llc       chase   --duration {DURATION} --working_set_bytes 67108864   --stride_bytes 128 --accesses 1000000
chase_hbm       chase   --duration {DURATION} --working_set_bytes 1073741824 --stride_bytes 128 --accesses 8388608

# --- Level 3: GEMM (geblockt, 128x128-Kacheln im LDS, ohne Matrix Cores) ----------------
# Arithmetische Intensitaet nach Verkehrsmodell, unabhaengig von M und N:
#   AI = 2K / (s_in * 2K/128 + s_out)      fp64: AI = 16K / (K + 64)
# K-Sweep in fp64 (M = N = 8192):                          AI [Flop/Byte]
gemm_fp64_k1      gemm  --duration {DURATION} --precision fp64 --m 8192 --n 8192 --k 1      #  0.25
gemm_fp64_k8      gemm  --duration {DURATION} --precision fp64 --m 8192 --n 8192 --k 8      #  1.8
gemm_fp64_k32     gemm  --duration {DURATION} --precision fp64 --m 8192 --n 8192 --k 32     #  5.3
gemm_fp64_k64     gemm  --duration {DURATION} --precision fp64 --m 8192 --n 8192 --k 64     #  8.0
gemm_fp64_k256    gemm  --duration {DURATION} --precision fp64 --m 8192 --n 8192 --k 256    # 12.8
gemm_fp64_k2048   gemm  --duration {DURATION} --precision fp64 --m 8192 --n 8192 --k 2048   # 15.5
# Andere Praezisionen, quadratisch 4096:
gemm_fp32         gemm  --duration {DURATION} --precision fp32       --size 4096            # 31.5
gemm_fp16acc32    gemm  --duration {DURATION} --precision fp16 --accumulate fp32 --size 4096   # 63.0
gemm_int8         gemm  --duration {DURATION} --precision int8       --size 4096            # 120.5
# Naive Variante (ein Thread pro Element, ohne LDS). Wiederverwendung nur ueber die Caches,
# a_intensity ist hier die ideale AI (A, B, C je einmal), der echte Verkehr liegt viel hoeher.
gemm_naive_fp64   gemm  --duration {DURATION} --kernel naive --precision fp64 --m 8192 --n 8192 --k 512
