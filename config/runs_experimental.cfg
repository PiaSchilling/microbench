# Run config for experiments (sources in src/experimental/, NOT part of the coverage analysis).
# Format: see config/runs.cfg.
#
#   ./build.sh --src-dir src/experimental l1_width
#   ./run_suite.sh --mode profile --config config/runs_experimental.cfg --src-dir src/experimental \
#                  --counters config/counters_axes_gfx942.cfg --only l1_width_4,l1_width_8,l1_width_16

# L1 axis validation (project note axis_validation.md): cached_read kernel with 4-, 8- and 16-byte loads, 16 KiB buffer
l1_width_4      l1_width  --duration {DURATION} --width 4
l1_width_8      l1_width  --duration {DURATION} --width 8
l1_width_16     l1_width  --duration {DURATION} --width 16
