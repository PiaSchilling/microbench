# Parameter sweeps of benchmarks in src/ (NOT part of the coverage analysis).
# Format: see config/runs.cfg. Sources: src/ (default --src-dir).
#
#   ./run_suite.sh --mode profile --config config/runs_sweeps.cfg \
#                  --counters config/counters_axes_gfx942.cfg

# gather: strided vs. random as a function of the stride (measure_queue item 3).
# Measured 25.11.: at 128 B (one access per cache line) strided ~ random on every level.
# Expected: 16 B strided = coalesced (8 lines per wavefront, like read) >> random (64 lines);
# 64 B strided 2 accesses per line; 128 / 256 B both one line per access; 4096 B strided
# (power of two) possibly concentrated on few L2 channels / HBM banks -> slower than random.
gather_strided_l2_s16     gather --duration {DURATION} --pattern strided --working_set_bytes 2097152    --stride_bytes 16
gather_random_l2_s16      gather --duration {DURATION} --pattern random  --working_set_bytes 2097152    --stride_bytes 16
gather_strided_l2_s64     gather --duration {DURATION} --pattern strided --working_set_bytes 2097152    --stride_bytes 64
gather_random_l2_s64      gather --duration {DURATION} --pattern random  --working_set_bytes 2097152    --stride_bytes 64
gather_strided_l2_s128    gather --duration {DURATION} --pattern strided --working_set_bytes 2097152    --stride_bytes 128
gather_random_l2_s128     gather --duration {DURATION} --pattern random  --working_set_bytes 2097152    --stride_bytes 128
gather_strided_l2_s256    gather --duration {DURATION} --pattern strided --working_set_bytes 2097152    --stride_bytes 256
gather_random_l2_s256     gather --duration {DURATION} --pattern random  --working_set_bytes 2097152    --stride_bytes 256
gather_strided_l2_s4096   gather --duration {DURATION} --pattern strided --working_set_bytes 2097152    --stride_bytes 4096
gather_random_l2_s4096    gather --duration {DURATION} --pattern random  --working_set_bytes 2097152    --stride_bytes 4096
gather_strided_hbm_s16    gather --duration {DURATION} --pattern strided --working_set_bytes 4294967296 --stride_bytes 16
gather_random_hbm_s16     gather --duration {DURATION} --pattern random  --working_set_bytes 4294967296 --stride_bytes 16
gather_strided_hbm_s64    gather --duration {DURATION} --pattern strided --working_set_bytes 4294967296 --stride_bytes 64
gather_random_hbm_s64     gather --duration {DURATION} --pattern random  --working_set_bytes 4294967296 --stride_bytes 64
gather_strided_hbm_s128   gather --duration {DURATION} --pattern strided --working_set_bytes 4294967296 --stride_bytes 128
gather_random_hbm_s128    gather --duration {DURATION} --pattern random  --working_set_bytes 4294967296 --stride_bytes 128
gather_strided_hbm_s256   gather --duration {DURATION} --pattern strided --working_set_bytes 4294967296 --stride_bytes 256
gather_random_hbm_s256    gather --duration {DURATION} --pattern random  --working_set_bytes 4294967296 --stride_bytes 256
gather_strided_hbm_s4096  gather --duration {DURATION} --pattern strided --working_set_bytes 4294967296 --stride_bytes 4096
gather_random_hbm_s4096   gather --duration {DURATION} --pattern random  --working_set_bytes 4294967296 --stride_bytes 4096
