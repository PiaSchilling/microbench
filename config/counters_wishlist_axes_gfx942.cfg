# Wish list for the validation of the Kiviat axes (gfx942), see the project note
# axis_validation.md. Input of tools/plan_counter_passes.sh, separate from the default
# wish list so that normal profile runs keep their few passes.
#
#   tools/plan_counter_passes.sh --wishlist config/counters_wishlist_axes_gfx942.cfg \
#                                --out config/counters_axes_gfx942.cfg
#   ./run_suite.sh --mode profile --counters config/counters_axes_gfx942.cfg --only <runs>
#   python3 axis_check.py results/<dir>          (next to kiviat.py)
#
# Format: want.<group>=<counter>,<counter>,...   agg.<counter>=sum|wmean (default sum)

# Current Kiviat axes (same as the default wish list), for the comparison old vs. new
want.sol=GRBM_GUI_ACTIVE,SQ_ACTIVE_INST_VALU,SQ_VALU_MFMA_BUSY_CYCLES,SQ_ACTIVE_INST_SCA,SQ_LDS_IDX_ACTIVE,SQ_LDS_BANK_CONFLICT,TCP_TOTAL_CACHE_ACCESSES_sum,TCC_REQ_sum,TCC_BUBBLE_sum,TCC_EA0_RDREQ_sum,TCC_EA0_RDREQ_32B_sum,TCC_EA0_WRREQ_sum,TCC_EA0_WRREQ_64B_sum

# L1 path: address unit (TA), data unit (TD), stalls, memory instructions
want.l1=TA_TA_BUSY_sum,TD_TD_BUSY_sum,TA_TOTAL_WAVEFRONTS_sum,TCP_TCP_TA_DATA_STALL_CYCLES_sum,TCP_PENDING_STALL_CYCLES_sum

# L2: busy (request pending) vs. cycles, hits and misses
want.l2=TCC_BUSY_sum,TCC_CYCLE_sum,TCC_HIT_sum,TCC_MISS_sum,TCC_READ_sum,TCC_WRITE_sum

# Beyond L2: requests that go to DRAM (rest: Infinity Cache)
want.fabric=TCC_EA0_RDREQ_DRAM_sum,TCC_EA0_WRREQ_DRAM_sum
