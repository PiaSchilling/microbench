# runs.conf -- Run-Konfiguration fuer run_suite.sh
#
# Format:  <label> <benchmark> <argumente ...>
#   label      eindeutiger Name des Laufs (wird in Logs und mit --only verwendet)
#   benchmark  fma | stream | chase | gemm
#   {DURATION} wird durch --duration ersetzt
#
# Zeilen auskommentieren, um Laeufe zu deaktivieren. Werte sind auf MI300A (gfx942) ausgelegt:
#   L1 32 KiB/CU, L2 4 MiB/XCD, Infinity Cache 256 MiB, HBM 128 GB.

# --- Level 1: Compute (VALU), compute-bound -------------------------------------------
fma_fp64        fma     --duration {DURATION} --ops_per_element 1000000 --precision fp64
fma_fp32        fma     --duration {DURATION} --ops_per_element 1000000 --precision fp32
fma_fp16        fma     --duration {DURATION} --ops_per_element 1000000 --precision fp16
# Integer noch nicht validiert:
#fma_int32      fma     --duration {DURATION} --ops_per_element 1000000 --precision int32

# --- Level 1: Speicherbandbreite --------------------------------------------------------
# stream_l2       stream  --duration {DURATION} --elements 524288      # 8 MiB gesamt -> Laufzeit so kurz, dass GB/s eher Kernel-Start als Bandbreite
# stream_llc      stream  --duration {DURATION} --elements 8388608     # 128 MiB gesamt -> Laufzeit so kurz, dass GB/s eher Kernel-Start als Bandbreite
stream_hbm      stream  --duration {DURATION} --elements 134217728     # 2 GiB gesamt

# --- Level 1: Speicherlatenz (Pointer Chasing) -------------------------------------------
# accesses >= Anzahl Knoten (working_set / stride), damit die ganze Kette durchlaufen wird
chase_l1        chase   --duration {DURATION} --working_set_bytes 16384      --stride_bytes 128 --accesses 1000000
chase_l2        chase   --duration {DURATION} --working_set_bytes 2097152    --stride_bytes 128 --accesses 1000000
chase_llc       chase   --duration {DURATION} --working_set_bytes 67108864   --stride_bytes 128 --accesses 1000000
chase_hbm       chase   --duration {DURATION} --working_set_bytes 1073741824 --stride_bytes 128 --accesses 8388608

# --- Level 3: GEMM (naiv, ein Thread pro Element von C) -----------------------------------
gemm_fp64       gemm  --duration {DURATION} --precision fp64       --size 4096
gemm_fp32       gemm  --duration {DURATION} --precision fp32       --size 4096
gemm_fp16acc32  gemm  --duration {DURATION} --precision fp16_acc32 --size 4096
gemm_int8       gemm  --duration {DURATION} --precision int8       --size 4096
# Form variieren, um die Intensitaet zu verschieben (flach in K -> niedrigere Intensitaet):
gemm_fp64_k256 gemm  --duration {DURATION} --precision fp64 --m 8192 --n 8192 --k 256
gemm_fp64_k64 gemm  --duration {DURATION} --precision fp64 --m 8192 --n 8192 --k 64
